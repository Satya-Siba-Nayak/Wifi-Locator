<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wi-Fi Locator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="main-container relative flex h-screen w-full overflow-hidden bg-zinc-950">
        <!-- Sidebar -->
        <aside
            id="sidebar"
            class="absolute top-0 left-0 h-full w-full max-w-sm bg-zinc-900/80 backdrop-blur-md flex flex-col z-30 transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:max-w-none md:w-[380px] lg:w-[420px] md:translate-x-0 md:border-r md:border-zinc-700/50">
            <header class="p-4 flex items-center justify-between border-b border-zinc-700/50 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.111 16.518C9.577 15.545 10.74 15 12 15c1.26 0 2.423.545 3.889 1.518" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.222 12.03a10.966 10.966 0 0115.556 0" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 18.5c.828 0 1.5-.672 1.5-1.5s-.672-1.5-1.5-1.5-1.5.672-1.5 1.5.672 1.5 1.5 1.5z" />
                    </svg>
                    <h1 class="text-xl font-semibold text-gray-100">Wi-Fi Locator</h1>
                </div>
                 <button id="close-sidebar-button" class="md:hidden p-2 -mr-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors" aria-label="Close sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </header>
            <div id="sidebar-content" class="p-4 flex-grow overflow-y-auto">
                <!-- Dynamic content will be injected here -->
            </div>
            <footer class="p-4 text-center text-xs text-zinc-500 border-t border-zinc-700/50 flex-shrink-0">
                <p>&copy; 2024 Wi-Fi Locator</p>
            </footer>
        </aside>

        <!-- Map View -->
        <main class="flex-grow h-full relative">
            <iframe id="map-iframe"
                class="absolute inset-0 w-full h-full border-0 filter invert-[95%] hue-rotate-[180deg] contrast-125"
                src="" title="OpenStreetMap view" aria-label="Map view" loading="lazy"></iframe>
            <div class="absolute top-4 left-4 z-10 flex flex-col items-center space-y-2 md:hidden">
                <button id="menu-button-map" class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Show places">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
            <div class="absolute top-4 right-4 z-10 flex flex-col items-center space-y-2">
                <button id="profile-button-map"
                    class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Profile">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                <button id="search-button-map"
                    class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-label="Search locations">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
                <div class="!mt-4 bg-zinc-900/70 backdrop-blur-md rounded-xl shadow-lg border border-zinc-700/50 text-zinc-300">
                    <button id="recenter-map-button" class="p-2.5 hover:bg-zinc-800/60 rounded-t-xl transition-colors border-b border-zinc-700/80"
                        aria-label="Center on my location">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                    <button class="p-2.5 hover:bg-zinc-800/60 rounded-b-xl transition-colors"
                        aria-label="Reset map orientation">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m14.243-7.243l-1.414 1.414M6.172 17.828l-1.414 1.414m13.07-1.414l-1.414-1.414M7.586 6.172L6.172 7.586" />
                            <path fill="currentColor" d="M12 13l3-4-3-4-3 4 3 4z" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Search Overlay -->
    <div id="search-overlay" class="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-lg transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none" aria-hidden="true">
        <div class="relative w-full h-full">
            <button id="close-search-overlay" class="absolute top-6 right-6 p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors" aria-label="Close search">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="flex flex-col items-center justify-start pt-20 md:pt-24 px-4">
                <div class="w-full max-w-2xl text-center">
                    <h2 class="text-3xl font-bold text-zinc-100 mb-2">Where to?</h2>
                    <p class="text-zinc-400 mb-8">Find a spot with the perfect vibe and great Wi-Fi.</p>
                    <form id="search-form" role="search" class="relative">
                        <input id="search-input" type="text" placeholder="Search for coffee shops, libraries..." aria-label="Search for locations" class="w-full bg-zinc-800 border-2 border-zinc-700 rounded-full pl-14 pr-6 py-4 text-lg text-zinc-100 placeholder-zinc-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-zinc-900 shadow-lg transition-all outline-none" />
                        <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                    </form>

                    <div id="search-recommendations" class="mt-10">
                        <h3 class="text-sm font-semibold text-zinc-400 mb-4">Or try one of these</h3>
                        <div class="flex flex-wrap gap-3 justify-center">
                           <!-- Recommendation pills here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Profile Overlay -->
    <div id="profile-overlay" class="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-lg transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none" aria-hidden="true">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="relative w-full max-w-md bg-zinc-900/80 backdrop-blur-2xl border border-zinc-700/50 rounded-3xl p-8">
                <button id="close-profile-overlay" class="absolute top-4 right-4 p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors" aria-label="Close profile">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                
                <div class="flex flex-col items-center mb-8">
                  <div class="p-4 bg-zinc-800 border-2 border-zinc-700 rounded-full mb-4">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </div>
                  <h2 class="text-2xl font-bold text-zinc-100">Welcome</h2>
                  <p class="text-zinc-400">Sign in or create an account to continue.</p>
                </div>

                <div id="segmented-control" class="relative bg-zinc-800 rounded-full p-1 flex items-center mb-8">
                    <div id="segmented-control-bg" class="absolute top-1 bottom-1 left-1 w-1/2 bg-zinc-700 rounded-full transition-transform duration-300 ease-in-out"></div>
                    <button id="login-tab" class="flex-1 py-2 text-center text-sm font-semibold text-zinc-100 z-10 transition-colors">Sign In</button>
                    <button id="signup-tab" class="flex-1 py-2 text-center text-sm font-semibold text-zinc-400 z-10 transition-colors">Sign Up</button>
                </div>
    
                <form id="auth-form" class="space-y-4">
                  <div id="name-field" class="hidden">
                    <label for="name" class="block text-sm font-medium text-zinc-400 mb-1">Name</label>
                    <input id="name" type="text" required placeholder="John Doe" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                  </div>
                  <div>
                    <label for="email" class="block text-sm font-medium text-zinc-400 mb-1">Email Address</label>
                    <input id="email" type="email" required placeholder="you@example.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                  </div>
                   <div>
                    <label for="password" class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                    <input id="password" type="password" required placeholder="••••••••" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                  </div>
                  <button id="auth-submit-button" type="submit" class="w-full !mt-6 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 focus:ring-blue-500">
                    Sign In
                  </button>
                </form>
            </div>
          </div>
    </div>


    <script type="module" src="/index.js"></script>
</body>

</html>
