<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wi-Fi Locator</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <!-- Supabase Configuration and Services (using ES6 modules) -->
        <script type="module" src="supabase-config.js"></script>
        <script type="module" src="supabase-auth.js"></script>
        <script type="module" src="supabase-db.js"></script>

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div
            class="main-container relative flex h-screen w-full overflow-hidden bg-zinc-950"
        >
            <!-- Sidebar -->
            <aside
                id="sidebar"
                class="absolute top-0 left-0 h-full w-full max-w-sm bg-zinc-900/80 backdrop-blur-md flex flex-col z-[1001] transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:max-w-none md:w-[380px] lg:w-[420px] md:translate-x-0 md:border-r md:border-zinc-700/50"
            >
                <header
                    id="sidebar-header"
                    class="p-4 flex items-center justify-between border-b border-zinc-700/50 flex-shrink-0"
                >
                    <button
                        id="back-button"
                        class="hidden p-2 -ml-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                        aria-label="Back to filters"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M15 19l-7-7 7-7"
                            />
                        </svg>
                    </button>
                    <div id="sidebar-title" class="flex items-center space-x-3">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 text-gray-300"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M8.111 16.518C9.577 15.545 10.74 15 12 15c1.26 0 2.423.545 3.889 1.518"
                            />
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M4.222 12.03a10.966 10.966 0 0115.556 0"
                            />
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 18.5c.828 0 1.5-.672 1.5-1.5s-.672-1.5-1.5-1.5-1.5.672-1.5 1.5.672 1.5 1.5 1.5z"
                            />
                        </svg>
                        <h1 class="text-xl font-semibold text-gray-100">
                            Wi-Fi Locator
                        </h1>
                    </div>
                    <button
                        id="close-sidebar-button"
                        class="md:hidden p-2 -mr-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                        aria-label="Close sidebar"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18L18 6M6 6l12 12"
                            />
                        </svg>
                    </button>
                </header>
                <div id="sidebar-content" class="p-4 flex-grow overflow-y-auto">
                    <!-- Dynamic content will be injected here -->
                </div>
                <footer
                    class="p-4 text-center text-xs text-zinc-500 border-t border-zinc-700/50 flex-shrink-0"
                >
                    <p>&copy; 2024 Wi-Fi Locator</p>
                </footer>
            </aside>

            <!-- Map View -->
            <main class="flex-grow h-full relative">
                <div id="map" class="absolute inset-0 w-full h-full"></div>
                <div
                    class="absolute top-4 left-4 z-[1000] flex flex-col items-center space-y-2 md:hidden"
                >
                    <button
                        id="menu-button-map"
                        class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                        aria-label="Show places"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 text-gray-300"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M4 6h16M4 12h16M4 18h16"
                            />
                        </svg>
                    </button>
                </div>
                <div
                    class="absolute top-4 right-4 z-[1000] flex flex-col items-center space-y-2"
                >
                    <button
                        id="profile-button-map"
                        class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                        aria-label="Profile"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6 text-gray-300"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"
                            />
                        </svg>
                    </button>
                    <button
                        id="search-button-map"
                        class="p-3 bg-zinc-900/70 backdrop-blur-md rounded-full shadow-lg border border-zinc-700/50 text-zinc-300 hover:bg-zinc-800/60 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                        aria-label="Search locations"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 text-gray-400"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                            />
                        </svg>
                    </button>
                    <div
                        class="!mt-4 bg-zinc-900/70 backdrop-blur-md rounded-xl shadow-lg border border-zinc-700/50 text-zinc-300"
                    >
                        <button
                            id="recenter-map-button"
                            class="p-2.5 hover:bg-zinc-800/60 rounded-t-xl transition-colors border-b border-zinc-700/80"
                            aria-label="Center on my location"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-5 w-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                                />
                            </svg>
                        </button>
                        <button
                            class="p-2.5 hover:bg-zinc-800/60 rounded-b-xl transition-colors"
                            aria-label="Reset map orientation"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-5 w-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 21a9 9 0 100-18 9 9 0 000 18z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 3v2m0 14v2m9-9h-2M5 12H3m14.243-7.243l-1.414 1.414M6.172 17.828l-1.414 1.414m13.07-1.414l-1.414-1.414M7.586 6.172L6.172 7.586"
                                />
                                <path
                                    fill="currentColor"
                                    d="M12 13l3-4-3-4-3 4 3 4z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- Contribute Button -->
                <button
                    id="contribute-button"
                    class="absolute bottom-6 right-6 z-[1000] px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-full shadow-lg border border-blue-500/50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center space-x-2"
                    aria-label="Contribute a location"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 4v16m8-8H4"
                        />
                    </svg>
                    <span>Contribute</span>
                </button>
            </main>
        </div>

        <!-- Search Overlay -->
        <div
            id="search-overlay"
            class="fixed inset-0 z-[2000] bg-zinc-950/80 backdrop-blur-lg transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none"
            aria-hidden="true"
        >
            <div class="relative w-full h-full">
                <button
                    id="close-search-overlay"
                    class="absolute top-6 right-6 p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                    aria-label="Close search"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18L18 6M6 6l12 12"
                        />
                    </svg>
                </button>
                <div
                    class="flex flex-col items-center justify-start pt-20 md:pt-24 px-4"
                >
                    <div class="w-full max-w-2xl text-center">
                        <h2 class="text-3xl font-bold text-zinc-100 mb-2">
                            Where to?
                        </h2>
                        <p class="text-zinc-400 mb-8">
                            Find a spot with the perfect vibe and great Wi-Fi.
                        </p>
                        <form id="search-form" role="search" class="relative">
                            <input
                                id="search-input"
                                type="text"
                                placeholder="Search for coffee shops, libraries..."
                                aria-label="Search for locations"
                                class="w-full bg-zinc-800 border-2 border-zinc-700 rounded-full pl-14 pr-6 py-4 text-lg text-zinc-100 placeholder-zinc-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-zinc-900 shadow-lg transition-all outline-none"
                            />
                            <div
                                class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-5 w-5 text-gray-400"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                    />
                                </svg>
                            </div>
                        </form>

                        <div id="search-recommendations" class="mt-10">
                            <h3
                                class="text-sm font-semibold text-zinc-400 mb-4"
                            >
                                Or try one of these
                            </h3>
                            <div class="flex flex-wrap gap-3 justify-center">
                                <!-- Recommendation pills here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Overlay -->
        <div
            id="profile-overlay"
            class="fixed inset-0 z-[2000] bg-zinc-950/80 backdrop-blur-lg transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none"
            aria-hidden="true"
        >
            <div class="flex items-center justify-center min-h-screen p-4">
                <div
                    class="relative w-full max-w-md bg-zinc-900/80 backdrop-blur-2xl border border-zinc-700/50 rounded-3xl p-8"
                >
                    <button
                        id="close-profile-overlay"
                        class="absolute top-4 right-4 p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                        aria-label="Close profile"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18L18 6M6 6l12 12"
                            />
                        </svg>
                    </button>

                    <div class="flex flex-col items-center mb-8">
                        <div
                            class="p-4 bg-zinc-800 border-2 border-zinc-700 rounded-full mb-4"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-6 w-6 text-gray-300"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="1.5"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                            </svg>
                        </div>
                        <h2 class="text-2xl font-bold text-zinc-100">
                            Welcome
                        </h2>
                        <p class="text-zinc-400">
                            Sign in or create an account to continue.
                        </p>
                    </div>

                    <!-- Error Message -->
                    <div
                        id="auth-error-message"
                        class="hidden mb-4 p-3 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm"
                    ></div>

                    <!-- Success Message -->
                    <div
                        id="auth-success-message"
                        class="hidden mb-4 p-3 bg-green-900/30 border border-green-700 rounded-lg text-green-300 text-sm"
                    ></div>

                    <div
                        id="segmented-control"
                        class="relative bg-zinc-800 rounded-full p-1 flex items-center mb-8"
                    >
                        <div
                            id="segmented-control-bg"
                            class="absolute top-1 bottom-1 left-1 w-1/2 bg-zinc-700 rounded-full transition-transform duration-300 ease-in-out"
                        ></div>
                        <button
                            id="login-tab"
                            class="flex-1 py-2 text-center text-sm font-semibold text-zinc-100 z-10 transition-colors"
                        >
                            Sign In
                        </button>
                        <button
                            id="signup-tab"
                            class="flex-1 py-2 text-center text-sm font-semibold text-zinc-400 z-10 transition-colors"
                        >
                            Sign Up
                        </button>
                    </div>

                    <form id="auth-form" class="space-y-4">
                        <div id="name-field" class="hidden">
                            <label
                                for="name"
                                class="block text-sm font-medium text-zinc-400 mb-1"
                                >Name</label
                            >
                            <input
                                id="name"
                                type="text"
                                required
                                placeholder="John Doe"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            />
                        </div>
                        <div>
                            <label
                                for="email"
                                class="block text-sm font-medium text-zinc-400 mb-1"
                                >Email Address</label
                            >
                            <input
                                id="email"
                                type="email"
                                required
                                placeholder="you@example.com"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            />
                        </div>
                        <div>
                            <label
                                for="password"
                                class="block text-sm font-medium text-zinc-400 mb-1"
                                >Password</label
                            >
                            <input
                                id="password"
                                type="password"
                                required
                                placeholder="••••••••"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            />
                        </div>
                        <button
                            id="auth-submit-button"
                            type="submit"
                            class="w-full !mt-6 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 focus:ring-blue-500"
                        >
                            Sign In
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="relative flex items-center my-6">
                        <div class="flex-grow border-t border-zinc-700"></div>
                        <span class="mx-4 text-sm text-zinc-500">or</span>
                        <div class="flex-grow border-t border-zinc-700"></div>
                    </div>

                    <!-- Google Sign-In Button -->
                    <button
                        id="google-signin-button"
                        type="button"
                        class="w-full bg-white text-gray-800 font-semibold py-3 rounded-lg hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 focus:ring-gray-300 flex items-center justify-center space-x-3"
                    >
                        <svg
                            class="w-5 h-5"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"
                            />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"
                            />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05"
                            />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"
                            />
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <!-- User Info (shown when logged in) -->
                    <div
                        id="user-info"
                        class="hidden mt-6 p-4 bg-zinc-800 rounded-lg"
                    >
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div
                                    id="user-avatar"
                                    class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-semibold"
                                ></div>
                                <div>
                                    <p
                                        id="user-name"
                                        class="text-zinc-100 font-medium"
                                    ></p>
                                    <p
                                        id="user-email"
                                        class="text-zinc-400 text-sm"
                                    ></p>
                                </div>
                            </div>
                            <button
                                id="signout-button"
                                class="px-4 py-2 bg-zinc-700 text-zinc-200 rounded-lg hover:bg-zinc-600 transition-colors text-sm font-medium"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contribute Overlay -->
        <div
            id="contribute-overlay"
            class="fixed inset-0 z-[2000] bg-zinc-950/80 backdrop-blur-lg transition-opacity duration-300 ease-in-out opacity-0 pointer-events-none"
            aria-hidden="true"
        >
            <div class="flex items-center justify-center min-h-screen p-4">
                <div
                    class="relative w-full max-w-2xl bg-zinc-900/80 backdrop-blur-2xl border border-zinc-700/50 rounded-3xl p-8 max-h-[90vh] overflow-y-auto"
                >
                    <button
                        id="close-contribute-overlay"
                        class="absolute top-4 right-4 p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition-colors"
                        aria-label="Close contribute form"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-6 w-6"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6 18L18 6M6 6l12 12"
                            />
                        </svg>
                    </button>

                    <div class="mb-8">
                        <div class="flex items-center space-x-3 mb-2">
                            <div
                                class="p-3 bg-blue-600/20 border-2 border-blue-600 rounded-full"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="h-6 w-6 text-blue-400"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M12 4v16m8-8H4"
                                    />
                                </svg>
                            </div>
                            <h2 class="text-3xl font-bold text-zinc-100">
                                Contribute a Location
                            </h2>
                        </div>
                        <p class="text-zinc-400 ml-16">
                            Help others find great Wi-Fi spots by sharing your
                            favorite places.
                        </p>
                    </div>

                    <form id="contribute-form" class="space-y-6">
                        <!-- Name -->
                        <div>
                            <label
                                for="place-name"
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Place Name <span class="text-red-400">*</span>
                            </label>
                            <input
                                id="place-name"
                                type="text"
                                required
                                placeholder="e.g., Central Coffee House"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-zinc-100 placeholder-zinc-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            />
                        </div>

                        <!-- Location -->
                        <div>
                            <label
                                for="place-location"
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Address <span class="text-red-400">*</span>
                            </label>
                            <input
                                id="place-location"
                                type="text"
                                required
                                placeholder="123 Main St, City, State"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-zinc-100 placeholder-zinc-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            />
                        </div>

                        <!-- Wi-Fi Type -->
                        <div>
                            <label
                                for="wifi-type"
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Wi-Fi Type <span class="text-red-400">*</span>
                            </label>
                            <select
                                id="wifi-type"
                                required
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-zinc-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                            >
                                <option value="">Select Wi-Fi type</option>
                                <option value="free">Free & Open</option>
                                <option value="password">
                                    Password Protected
                                </option>
                                <option value="customer">
                                    For Customers Only
                                </option>
                            </select>
                        </div>

                        <!-- Category -->
                        <div>
                            <label
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Category <span class="text-red-400">*</span>
                            </label>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="coffee"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >☕ Coffee Shop</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="library"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >📚 Library</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="coworking"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >💼 Coworking</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="restaurant"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >🍽️ Restaurant</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="park"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >🌳 Park</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                                <label
                                    class="relative flex items-center justify-center p-3 bg-zinc-800 border-2 border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name="category"
                                        value="other"
                                        required
                                        class="sr-only peer"
                                    />
                                    <span
                                        class="peer-checked:text-blue-400 text-zinc-300 font-medium"
                                        >✨ Other</span
                                    >
                                    <div
                                        class="absolute inset-0 border-2 border-blue-500 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity"
                                    ></div>
                                </label>
                            </div>
                        </div>

                        <!-- Photos -->
                        <div>
                            <label
                                for="place-photos"
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Photos (Optional)
                            </label>
                            <div class="relative">
                                <input
                                    id="place-photos"
                                    type="file"
                                    accept="image/*"
                                    multiple
                                    class="hidden"
                                />
                                <label
                                    for="place-photos"
                                    class="flex flex-col items-center justify-center w-full h-32 bg-zinc-800 border-2 border-dashed border-zinc-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors"
                                >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="h-8 w-8 text-zinc-500 mb-2"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                                        />
                                    </svg>
                                    <span class="text-sm text-zinc-400"
                                        >Click to upload photos</span
                                    >
                                    <span class="text-xs text-zinc-500 mt-1"
                                        >PNG, JPG up to 10MB</span
                                    >
                                </label>
                            </div>
                        </div>

                        <!-- Additional Notes -->
                        <div>
                            <label
                                for="place-notes"
                                class="block text-sm font-medium text-zinc-400 mb-2"
                            >
                                Additional Notes (Optional)
                            </label>
                            <textarea
                                id="place-notes"
                                rows="3"
                                placeholder="Any other details about Wi-Fi speed, outlets, atmosphere, etc."
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 text-zinc-100 placeholder-zinc-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"
                            ></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-3 pt-4">
                            <button
                                type="button"
                                id="contribute-cancel"
                                class="flex-1 px-6 py-3 bg-zinc-800 text-zinc-300 font-semibold rounded-lg hover:bg-zinc-700 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-600"
                            >
                                Cancel
                            </button>
                            <button
                                type="submit"
                                class="flex-1 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                Submit Contribution
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
