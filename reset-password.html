<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Wi-Fi Locator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">
    <!-- Supabase Client -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Initialize Supabase (update with your credentials)
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        window.supabase = createClient(supabaseUrl, supabaseKey);

        console.log('✅ Supabase initialized for password reset');
    </script>
    <script src="supabase-config.js"></script>
    <script src="supabase-helpers.js"></script>
    <script src="supabase-auth.js"></script>

    <div class="w-full max-w-md">
        <div class="bg-zinc-900 rounded-2xl shadow-2xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-zinc-100">Reset Your Password</h1>
                <p class="text-zinc-400 mt-2">Enter your new password below</p>
            </div>

            <!-- Success Message -->
            <div id="success-message" class="hidden mb-4 p-4 bg-green-900/30 border border-green-700 rounded-lg text-green-300 text-sm text-center">
                Password updated successfully! Redirecting to login...
            </div>

            <!-- Error Message -->
            <div id="error-message" class="hidden mb-4 p-4 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm"></div>

            <!-- Reset Form -->
            <form id="reset-form" class="space-y-4">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-zinc-400 mb-1">
                        New Password
                    </label>
                    <input
                        id="new-password"
                        type="password"
                        required
                        minlength="6"
                        placeholder="Enter new password (min 6 characters)"
                        class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    />
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-zinc-400 mb-1">
                        Confirm Password
                    </label>
                    <input
                        id="confirm-password"
                        type="password"
                        required
                        minlength="6"
                        placeholder="Re-enter new password"
                        class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2.5 text-zinc-100 placeholder-zinc-500 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    />
                </div>

                <button
                    id="reset-button"
                    type="submit"
                    class="w-full !mt-6 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-zinc-950 focus:ring-blue-500"
                >
                    Update Password
                </button>
            </form>

            <!-- Back to Login -->
            <div class="mt-6 text-center">
                <a href="index.html" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">
                    ← Back to Login
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-zinc-500 text-sm mt-6">
            Wi-Fi Locator - Find WiFi hotspots near you
        </p>
    </div>

    <script>
        // Wait for auth service to initialize
        const waitForAuth = () => {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (window.authService && window.authService.initialized) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);

                setTimeout(() => {
                    clearInterval(checkInterval);
                    resolve();
                }, 5000);
            });
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await waitForAuth();
            console.log('✅ Auth service ready');

            const resetForm = document.getElementById('reset-form');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const resetButton = document.getElementById('reset-button');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            // Show error
            const showError = (message) => {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
            };

            // Show success
            const showSuccess = (message) => {
                successMessage.textContent = message;
                successMessage.classList.remove('hidden');
                errorMessage.classList.add('hidden');
            };

            // Check if this is a valid password reset session
            const checkResetSession = async () => {
                try {
                    const { data: { session } } = await window.supabase.auth.getSession();

                    if (!session) {
                        showError('Invalid or expired reset link. Please request a new password reset.');
                        resetForm.classList.add('hidden');
                        return false;
                    }

                    console.log('✅ Valid reset session');
                    return true;
                } catch (error) {
                    console.error('Session check error:', error);
                    showError('Unable to verify reset link. Please try again.');
                    return false;
                }
            };

            // Check session on load
            await checkResetSession();

            // Handle form submission
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                // Clear previous messages
                errorMessage.classList.add('hidden');
                successMessage.classList.add('hidden');

                // Validate passwords match
                if (newPassword !== confirmPassword) {
                    showError('🔒 Passwords do not match. Please try again.');
                    return;
                }

                // Validate password length
                if (newPassword.length < 6) {
                    showError('🔒 Password must be at least 6 characters long.');
                    return;
                }

                // Disable button and show loading
                resetButton.disabled = true;
                resetButton.textContent = 'Updating...';

                try {
                    const result = await window.authService.updatePassword(newPassword);

                    if (result.success) {
                        showSuccess(result.message);

                        // Redirect to login after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    } else {
                        showError(result.error);
                        resetButton.disabled = false;
                        resetButton.textContent = 'Update Password';
                    }
                } catch (error) {
                    console.error('Password update error:', error);
                    showError('❌ Failed to update password. Please try again.');
                    resetButton.disabled = false;
                    resetButton.textContent = 'Update Password';
                }
            });

            // Real-time password match validation
            confirmPasswordInput.addEventListener('input', () => {
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (confirmPassword.length > 0) {
                    if (newPassword !== confirmPassword) {
                        confirmPasswordInput.setCustomValidity('Passwords do not match');
                        confirmPasswordInput.style.borderColor = '#ef4444';
                    } else {
                        confirmPasswordInput.setCustomValidity('');
                        confirmPasswordInput.style.borderColor = '#22c55e';
                    }
                } else {
                    confirmPasswordInput.setCustomValidity('');
                    confirmPasswordInput.style.borderColor = '';
                }
            });
        });
    </script>
</body>
</html>
